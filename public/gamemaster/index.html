<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teambuilding FIT — Quản trò</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="center-screen">
  <div style="width: 100%; max-width: 420px;">
    <div class="brand"><span class="dot"></span> Teambuilding FIT</div>
    <div class="card">
      <h3 style="margin-top:0;">Đăng nhập Quản trò</h3>
      <p class="small-note" style="margin-top:-10px; margin-bottom:16px;">Dành cho người phụ trách chấm điểm 1 trò chơi cụ thể.</p>
      <form id="gmForm">
        <label>Tài khoản</label>
        <input type="text" id="gmUser" placeholder="tài khoản quản trò" autocomplete="username" required autofocus>
        <label>Mật khẩu</label>
        <input type="password" id="gmPassword" placeholder="••••••" autocomplete="current-password" required>
        <div class="error-msg" id="gmError"></div>
        <button type="submit" class="btn block">Đăng nhập</button>
      </form>
    </div>
    <p class="small-note" style="text-align:center; margin-top:28px;">
      <a href="/">← Trang dành cho đội chơi</a> · <a href="/admin/">Trang Ban tổ chức</a>
    </p>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
fetch('/api/public/login-background').then(r => r.json()).then(({ background_image }) => {
  if (!background_image) return;
  document.body.style.backgroundImage = `linear-gradient(rgba(10,13,22,.72), rgba(10,13,22,.82)), url(${background_image})`;
  document.body.style.backgroundSize = 'cover';
  document.body.style.backgroundPosition = 'center';
  document.body.style.backgroundAttachment = 'fixed';
}).catch(() => {});

document.getElementById('gmForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('gmUser').value.trim();
  const password = document.getElementById('gmPassword').value;
  const errEl = document.getElementById('gmError');
  errEl.textContent = '';
  try {
    await api('POST', '/api/auth/gamemaster/login', { username, password });
    window.location.href = '/gamemaster/dashboard.html';
  } catch (err) { errEl.textContent = err.message; }
});
</script>
</body>
</html>
